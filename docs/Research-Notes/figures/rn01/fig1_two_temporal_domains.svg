<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#3a4a5a"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#ffffff"/>

  <!-- Physical world band (top) -->
  <rect x="40" y="40" width="560" height="150" rx="10" fill="#f1f7f2" stroke="#bcd7c0" stroke-width="1.2"/>
  <text x="60" y="66" font-size="13" fill="#3f7a4b" font-style="italic" letter-spacing="1.5">PHYSICAL TIME &#183; the physical world</text>

  <!-- Blockchain world band (middle) -->
  <rect x="40" y="230" width="560" height="150" rx="10" fill="#eef2fb" stroke="#c3cdea" stroke-width="1.2"/>
  <text x="60" y="256" font-size="13" fill="#3a55a8" font-style="italic" letter-spacing="1.5">BLOCKCHAIN TIME &#183; the protocol</text>

  <!-- Physical world band (bottom) -->
  <rect x="40" y="420" width="560" height="100" rx="10" fill="#f1f7f2" stroke="#bcd7c0" stroke-width="1.2"/>
  <text x="60" y="446" font-size="13" fill="#3f7a4b" font-style="italic" letter-spacing="1.5">PHYSICAL TIME &#183; execution experienced</text>

  <!-- boxes -->
  <g font-size="15" fill="#1a2332" text-anchor="middle">
    <rect x="220" y="80" width="200" height="38" rx="6" fill="#ffffff" stroke="#7a9a80" stroke-width="1.3"/>
    <text x="320" y="104">Application Event</text>

    <rect x="220" y="136" width="200" height="38" rx="6" fill="#ffffff" stroke="#7a9a80" stroke-width="1.3"/>
    <text x="320" y="160">Transaction Created</text>

    <!-- TEP bridge -->
    <rect x="196" y="192" width="248" height="46" rx="8" fill="#fbf3e2" stroke="#c99a3b" stroke-width="1.8"/>
    <text x="320" y="215" font-size="15" fill="#8a5a12" font-weight="bold">Temporal Execution Profile</text>
    <text x="320" y="231" font-size="11.5" fill="#8a5a12">demand-side bridge into the protocol</text>

    <rect x="200" y="270" width="240" height="44" rx="6" fill="#ffffff" stroke="#5f77c0" stroke-width="1.3"/>
    <text x="320" y="290">Execution Opportunities</text>
    <text x="320" y="307" font-size="11.5" fill="#5b6b7a">slots &#183; blocks &#183; ordering</text>

    <rect x="220" y="330" width="200" height="38" rx="6" fill="#ffffff" stroke="#5f77c0" stroke-width="1.3"/>
    <text x="320" y="354">Transaction Executed</text>

    <rect x="220" y="452" width="200" height="42" rx="6" fill="#ffffff" stroke="#7a9a80" stroke-width="1.3"/>
    <text x="320" y="472">Execution Time</text>
    <text x="320" y="488" font-size="11.5" fill="#5b6b7a">value realized by the user</text>
  </g>

  <!-- arrows -->
  <g stroke="#3a4a5a" stroke-width="1.6" marker-end="url(#arrow)" fill="none">
    <line x1="320" y1="118" x2="320" y2="134"/>
    <line x1="320" y1="174" x2="320" y2="190"/>
    <line x1="320" y1="238" x2="320" y2="268"/>
    <line x1="320" y1="314" x2="320" y2="328"/>
    <line x1="320" y1="368" x2="320" y2="450"/>
  </g>

  <text x="320" y="538" font-size="11.5" text-anchor="middle" fill="#5b6b7a" font-style="italic">Figure 1. Two temporal domains: applications in Physical Time, execution in Blockchain Time.</text>
</svg>
